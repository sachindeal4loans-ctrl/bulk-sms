<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Bulk SMS Manager</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <div class="brand-mark">B</div>
    <section class="panel auth-panel">
      <p class="eyebrow">WORKSPACE ACCESS</p>
      <h1>Welcome back</h1>
      <p class="subtext">Sign in to manage your messaging campaigns.</p>
      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
      <form action="/login" method="post">
        <label for="password">Admin password</label>
        <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
        <button class="btn btn-primary btn-full" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <p class="fine-print">Authorized administrators only.</p>
    </section>
    <p class="auth-footer">Bulk SMS Manager · Demo workspace</p>
  </main>
</body>
</html>
