
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bulk SMS Manager</title>
</head>
<body>
    <h1>Bulk SMS Manager</h1>
    <p>Welcome to your SMS dashboard.</p>

    <h2>Campaigns</h2>
    {% if campaigns %}
        <ul>
        {% for campaign in campaigns %}
            <li>{{ campaign }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No campaigns found.</p>
    {% endif %}
</body>
</html>
