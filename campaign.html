<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Campaign details</title><link rel="stylesheet" href="/static/style.css"></head><body><main><section><h1>Campaign #{{campaign.id}}</h1><p><b>Status:</b> {{campaign.status}}</p><p><b>Created:</b> {{campaign.created_at}}</p><p><b>Message:</b></p><pre>{{campaign.message}}</pre><h2>Recipients ({{recipients|length}})</h2><div class="table-wrap"><table><tr><th>Phone</th><th>Status</th><th>Details</th></tr>{% for r in recipients %}<tr><td>{{r.phone}}</td><td>{{r.status}}</td><td>{{r.detail}}</td></tr>{% endfor %}</table></div><p><a href="/">Back to dashboard</a></p></section></main></body></html>
